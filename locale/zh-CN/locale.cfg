[mod-setting-description]
ai-bot-tick-interval=全局 AI 处理间隔。数值越小反应越快，但 UPS 开销更大。
ai-bot-build-batch=每拍最多复活的蓝图实体数。
ai-bot-search-radius=找不到仓储材料时，全图搜寻矿点的半径。
ai-bot-warn-threshold=库存低于该数量时在资源面板标红预警。
ai-bot-auto-start=保存蓝图后立刻拿出盖章工具，仍需点地图确认位置。
ai-bot-force-build=放置蓝图时清理树木等自然障碍。
ai-bot-reserve-stock=从物流网取货时每种物品至少留下的数量。
ai-bot-work-range=Bot 必须走进该半径才会复活幽灵。
ai-bot-take-from-network=关闭后不抽物流网，只使用 Bot 货舱（以及可选的玩家背包）。
ai-bot-take-from-player=默认打开。关闭后只使用 Bot 货舱。
ai-bot-wait-timeout=物流请求超过该秒数仍缺料则任务失败。

