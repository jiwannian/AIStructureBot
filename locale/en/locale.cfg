[mod-setting-description]
ai-bot-auto-start=After saving a blueprint, give the stamp tool. You still click the map to place.
ai-bot-force-build=Clear trees and other nature when stamping.
ai-bot-reserve-stock=Minimum items left in the logistic network when taking stock.
ai-bot-work-range=The bot must enter this radius before ghosts are revived.
ai-bot-take-from-network=If off, the logistic network is not touched.
ai-bot-take-from-player=If off, the player inventory is not touched.
ai-bot-wait-timeout=Fail the job if logistics do not deliver in time.

