ai-bot-tick-interval=AI tick interval
ai-bot-build-batch=Entities per pulse
ai-bot-search-radius=Resource search radius
ai-bot-warn-threshold=Stock warning threshold
ai-bot-auto-start=Auto-equip stamp tool after save
ai-bot-force-build=Force-build over nature
ai-bot-reserve-stock=Logistic safety stock
ai-bot-work-range=Bot work range
ai-bot-take-from-network=Allow taking from logistic network
ai-bot-take-from-player=Allow taking from player inventory
