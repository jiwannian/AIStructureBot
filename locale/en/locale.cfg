[mod-name]
AIStructureBot=AI Structure Bot

[mod-description]
AIStructureBot=Plan ghosts or stamp the built-in blueprint library, then send AI bots to mine, craft, build, and deconstruct. Also supports base maintenance.

[entity-name]
ai-structure-bot=AI Structure Bot

[entity-description]
ai-structure-bot=An independent construction unit. Stamp a saved blueprint on the map, then it collects items and builds only after arriving.

[item-name]
ai-structure-bot=AI Structure Bot
ai-bot-assign-tool=AI Bot assign tool
ai-bot-stamp-tool=AI Bot stamp tool

[item-description]
ai-structure-bot=A controllable construction unit.
ai-bot-assign-tool=Select an AI Bot to make it the active unit.
ai-bot-stamp-tool=Unused. Stamping now puts a real blueprint on the cursor.

[recipe-name]
ai-structure-bot=AI Structure Bot

[technology-name]
ai-structure-bot=AI Structure Bot

[technology-description]
ai-structure-bot=Unlocks an AI bot that stamps blueprints, collects materials, and builds on site.

[controls]
ai-bot-toggle-menu=Toggle AI Bot menu
ai-bot-close-menu=Close AI Bot menu
ai-bot-toggle-plan=Toggle planning mode (time paused)
ai-bot-assign-ghosts=Send bot to build nearby ghosts

[shortcut-name]
ai-bot-open-menu=AI Bot menu
ai-bot-toggle-plan=Planning mode

